version: 2.1

jobs:
  gson:
    docker:
      # Newest JDK the build allows: `maven-enforcer-plugin` requires [17,26)
      - image: cimg/openjdk:25.0
    environment:
      # Same Maven arguments the GitHub Actions build uses
      MAVEN_ARGS: --show-version --batch-mode --no-transfer-progress
    steps:
      - checkout

      - run:
          name: Compute dependency cache key
          command: find . -name 'pom.xml' -not -path '*/target/*' | sort | xargs cat > /tmp/pom-checksum-source
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "/tmp/pom-checksum-source" }}
            - maven-v1-

      - run:
          name: Install dependencies and build
          command: mvn -DskipTests -Dspotless.check.skip=true install

      - save_cache:
          key: maven-v1-{{ checksum "/tmp/pom-checksum-source" }}
          paths:
            - ~/.m2/repository

      - run:
          name: Test
          # Also runs `javadoc:jar` to detect any issues with the Javadoc generated during release.
          # Spotless is skipped here because it runs as its own lint step below.
          command: mvn verify javadoc:jar -Dspotless.check.skip=true
      - run:
          name: Lint (Spotless / google-java-format)
          command: mvn spotless:check

      - run:
          name: Collect test results
          when: always
          command: |
            mkdir -p /tmp/test-results
            find . -path '*/target/surefire-reports/*.xml' -exec cp {} /tmp/test-results/ \;
      - store_test_results:
          path: /tmp/test-results

workflows:
  build:
    jobs:
      - gson
